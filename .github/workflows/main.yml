name: Build Frost Strength SMP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 21 (Paper 1.21 requires Java 21)
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'temurin'

      # 3. Find pom.xml anywhere in the repo and build from its directory
      - name: Build with Maven
        run: |
          # Search for pom.xml up to 4 levels deep
          POM_PATH=$(find . -name "pom.xml" -maxdepth 4 2>/dev/null | head -n 1)
          
          if [ -z "$POM_PATH" ]; then
            echo "✗ ERROR: pom.xml not found anywhere in the repo!"
            echo "Repo structure:"
            find . -maxdepth 3 -type d | sort
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$POM_PATH")
          echo "✓ Found pom.xml at: $POM_PATH"
          echo "✓ Building from: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          mvn clean package -DskipTests

      # 4. Upload the compiled .jar artifact (from any target/ folder)
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrostStrengthSMP-jar
          path: |
            **/target/*.jar
